<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #0a0a0d;
        --ink: #f5f5f7;
        --accent: #7c6cff;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family: 'Space Grotesk', sans-serif;
      }
      .scene {
        position: absolute;
        top: 0;
        left: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      .scene-content {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;   /* 靠下 */
        align-items: flex-end;       /* 靠右 */
        padding: 100px;              /* 距离边缘留出边距 */
        position: relative;
        z-index: 1;
      }
      .title {
        font-size: 90px;             /* 字幕字号调小 */
        font-weight: 700;
        margin-bottom: 20px;
        opacity: 0;                  /* 初始透明，防止闪烁 */
      }
      .subtitle {
        font-size: 60px;
        font-weight: 500;
        color: var(--accent);
        opacity: 0;                  /* 初始透明，防止闪烁 */
      }
    </style>
  </head>
  <body>
    <div
      id="main"
      data-composition-id="main"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="5"
    >
      <div class="scene clip" id="s1" data-start="0" data-duration="5" data-track-index="0">
        <div class="scene-content">
          <h1 class="title">Hello, {{USER_NAME}}!</h1>
          <h2 class="subtitle">Revenue: {{REVENUE}}</h2>
        </div>
      </div>
    </div>

    <script>
      // GSAP Animations: 从下方升起
      gsap.to(".title", { 
        y: 0, 
        opacity: 1, 
        duration: 1.5, 
        ease: "power3.out",
        delay: 0.5,
        startAt: { y: 100 } // 起始位置在下方 100px
      });
      
      gsap.to(".subtitle", { 
        y: 0, 
        opacity: 1, 
        duration: 1.5, 
        ease: "power3.out",
        delay: 1.2,
        startAt: { y: 100 }
      });
    </script>
  </body>
</html>
