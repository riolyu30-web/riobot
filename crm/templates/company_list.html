{% extends "sqladmin/list.html" %}

{% block content %}
    <!-- 定义一个弹性盒子容器，内容靠右对齐，设置边距和间距 -->
    <div style="display: flex; justify-content: flex-end; margin-bottom: 0.5rem; margin-top: -0.5rem; margin-right: 0.5rem; gap: 0.5rem;">
        <!-- 定义批量修改标签按钮，点击调用 batchUpdateTags 函数 -->
        <button class="btn btn-secondary" onclick="batchUpdateTags()">
            <!-- 添加 FontAwesome 的标签图标 -->
            <i class="fa-solid fa-tags"></i> 批量修改标签
        </button>
        <!-- 定义批量修改核心词按钮，点击调用 batchUpdateKeyword 函数 -->
        <button class="btn btn-secondary" onclick="batchUpdateKeyword()">
            <!-- 添加 FontAwesome 的字图标 -->
            <i class="fa-solid fa-file-word"></i> 批量修改核心词
        </button>
        <!-- 定义隐藏的文件上传输入框，支持多选图片，改变时调用 uploadNamecards 函数 -->
        <input type="file" id="importNamecards" multiple accept="image/*" style="display: none;" onchange="uploadNamecards(this)">
        <!-- 定义导入名片图片按钮，点击时触发文件输入框 -->
        <button class="btn btn-primary" onclick="document.getElementById('importNamecards').click()">
            <!-- 添加 FontAwesome 的相机图标 -->
            <i class="fa-solid fa-camera"></i> 导入名片
        </button>
        <!-- 定义隐藏的文件上传输入框，支持多选JSON，改变时调用 uploadJson 函数 -->
        <input type="file" id="importJson" multiple accept=".json" style="display: none;" onchange="uploadJson(this)">
        <!-- 定义导入JSON按钮，点击时触发文件输入框 -->
        <button class="btn btn-primary text-white" onclick="document.getElementById('importJson').click()">
            <!-- 添加 FontAwesome 的文件图标 -->
            <i class="fa-solid fa-file-code"></i> 导入JSON
        </button>
        <!-- 定义挖掘按钮，点击时调用 mineCompanies 函数 -->
        <button class="btn btn-success" onclick="mineCompanies(this)">
            <!-- 添加 FontAwesome 的放大镜图标 -->
            <i class="fa-solid fa-magnifying-glass"></i> 挖掘
        </button>
    </div>
    
    <!-- 开始定义 JavaScript 脚本 -->
    <script>
    // 定义获取选中行 ID 的辅助函数
    function getSelectedIds() {
        // 获取所有被勾选的多选框元素
        const checkboxes = document.querySelectorAll('input.select-box:checked');
        // 初始化一个空数组用于存放选中的 ID
        const pks = [];
        // 遍历所有被勾选的多选框
        checkboxes.forEach(cb => {
            // 获取当前多选框的父级 td 元素
            const tdElement = cb.parentElement;
            // 在父级 td 元素中查找隐藏的 input 元素（包含真实 ID）
            const hiddenInput = tdElement.querySelector('input[type="hidden"]');
            // 如果找到了隐藏的 input 元素并且它有值
            if (hiddenInput && hiddenInput.value) {
                // 将值转换为整数并存入数组
                pks.push(parseInt(hiddenInput.value));
            }
        });
        // 返回选中的 ID 数组
        return pks;
    }

    // 定义通用的批量更新函数，接收字段名、提示文本和目标接口 URL
    function batchUpdateField(fieldName, promptText, endpointUrl) {
        // 获取所有选中的 ID
        const pks = getSelectedIds();
        // 检查是否有选中的记录
        if (pks.length === 0) {
            // 如果没有选中记录，弹出提示
            alert("请先勾选需要修改的公司");
            // 结束函数执行
            return;
        }
        
        // 弹出输入框要求用户输入新值
        const newValue = prompt(`您已选中 ${pks.length} 个公司，${promptText}`);
        // 如果用户点击了取消或未输入任何内容
        if (newValue === null || newValue.trim() === '') {
            // 结束函数执行
            return;
        }
        
        // 构建请求的 JSON 数据对象，包含选中的 ID 列表
        const payload = { pks: pks };
        // 动态添加要更新的字段和对应的新值
        payload[fieldName] = newValue;

        // 发送 POST 请求到指定的后端接口
        fetch(endpointUrl, {
            // 设置请求方法为 POST
            method: 'POST',
            // 设置请求头，指定内容类型为 JSON
            headers: {
                'Content-Type': 'application/json'
            },
            // 将数据对象转换为 JSON 字符串作为请求体
            body: JSON.stringify(payload)
        })
        // 将服务器的响应解析为 JSON 对象
        .then(response => response.json())
        // 处理解析后的数据
        .then(data => {
            // 如果返回的数据中包含错误详情
            if (data.detail) {
                // 弹出修改失败的提示
                alert('修改失败: ' + data.detail);
            } else {
                // 弹出服务器返回的消息或默认的成功提示
                alert(data.message || '修改成功');
                // 刷新页面以显示最新数据
                window.location.reload();
            }
        })
        // 捕获网络请求或解析过程中的异常
        .catch(error => {
            // 弹出请求失败的错误提示
            alert('请求失败: ' + error);
        });
    }

    // 定义批量修改标签的函数
    function batchUpdateTags() {
        // 获取所有选中的 ID
        const pks = getSelectedIds();
        // 检查是否有选中的记录
        if (pks.length === 0) {
            // 如果没有选中记录，弹出提示
            alert("请先勾选需要修改的公司");
            // 结束函数执行
            return;
        }

        // 发起 GET 请求获取所有标签数据
        fetch('/tags')
            // 将响应解析为 JSON 格式
            .then(response => response.json())
            // 处理获取到的标签数据
            .then(data => {
                // 获取标签数组
                const tags = data.tags;
                // 检查标签数组是否为空
                if (!tags || tags.length === 0) {
                    // 如果没有标签，弹出提示
                    alert('系统中没有可用的标签，请先添加标签。');
                    // 结束函数执行
                    return;
                }

                // 创建模态框背景容器元素
                const modalOverlay = document.createElement('div');
                // 设置固定定位
                modalOverlay.style.position = 'fixed';
                // 距离顶部为0
                modalOverlay.style.top = '0';
                // 距离左侧为0
                modalOverlay.style.left = '0';
                // 宽度撑满全屏
                modalOverlay.style.width = '100%';
                // 高度撑满全屏
                modalOverlay.style.height = '100%';
                // 背景色为半透明黑色
                modalOverlay.style.backgroundColor = 'rgba(0,0,0,0.5)';
                // 设置极高的层级，确保在最上层
                modalOverlay.style.zIndex = '9999';
                // 使用弹性盒子布局
                modalOverlay.style.display = 'flex';
                // 垂直居中对齐
                modalOverlay.style.alignItems = 'center';
                // 水平居中对齐
                modalOverlay.style.justifyContent = 'center';

                // 创建模态框内容容器元素
                const modalContent = document.createElement('div');
                // 设置背景色为白色
                modalContent.style.backgroundColor = 'white';
                // 设置内边距为20像素
                modalContent.style.padding = '20px';
                // 设置圆角边框
                modalContent.style.borderRadius = '5px';
                // 设置最小宽度为300像素
                modalContent.style.minWidth = '300px';

                // 创建标题元素
                const title = document.createElement('h4');
                // 设置标题文本，显示选中的公司数量
                title.textContent = `您已选中 ${pks.length} 个公司，请选择标签：`;
                // 设置底部外边距
                title.style.marginBottom = '15px';
                // 将标题添加到模态框内容中
                modalContent.appendChild(title);

                // 创建下拉选择框元素
                const select = document.createElement('select');
                // 添加 Bootstrap 样式类
                select.className = 'form-select';
                // 设置底部外边距
                select.style.marginBottom = '15px';
                // 设置宽度撑满父容器
                select.style.width = '100%';
                // 设置内边距
                select.style.padding = '5px';
                
                // 遍历获取到的标签数据
                tags.forEach(tag => {
                    // 创建选项元素
                    const option = document.createElement('option');
                    // 设置选项的值为标签 ID
                    option.value = tag.id;
                    // 设置选项的显示文本为标签名称
                    option.textContent = tag.name;
                    // 将选项添加到下拉框中
                    select.appendChild(option);
                });
                // 将下拉框添加到模态框内容中
                modalContent.appendChild(select);

                // 创建按钮容器元素
                const btnContainer = document.createElement('div');
                // 使用弹性盒子布局
                btnContainer.style.display = 'flex';
                // 内容靠右对齐
                btnContainer.style.justifyContent = 'flex-end';
                // 设置按钮之间的间距
                btnContainer.style.gap = '10px';

                // 创建取消按钮元素
                const cancelBtn = document.createElement('button');
                // 设置按钮文本为“取消”
                cancelBtn.textContent = '取消';
                // 添加 Bootstrap 样式类
                cancelBtn.className = 'btn btn-secondary';
                // 点击取消按钮时移除模态框
                cancelBtn.onclick = () => document.body.removeChild(modalOverlay);
                
                // 创建确认按钮元素
                const confirmBtn = document.createElement('button');
                // 设置按钮文本为“确认”
                confirmBtn.textContent = '确认';
                // 添加 Bootstrap 样式类
                confirmBtn.className = 'btn btn-primary';
                // 定义确认按钮的点击事件处理函数
                confirmBtn.onclick = () => {
                    // 获取用户选中的标签 ID
                    const selectedTagId = select.value;
                    // 移除模态框
                    document.body.removeChild(modalOverlay);
                    
                    // 发起 POST 请求提交修改
                    fetch('/company/batch_update_tags', {
                        // 指定请求方法为 POST
                        method: 'POST',
                        // 设置请求头
                        headers: {
                            // 声明内容类型为 JSON
                            'Content-Type': 'application/json'
                        },
                        // 将请求数据转换为 JSON 字符串
                        body: JSON.stringify({ pks: pks, tag_id: parseInt(selectedTagId) })
                    })
                    // 将响应解析为 JSON 格式
                    .then(response => response.json())
                    // 处理后端返回的数据
                    .then(resData => {
                        // 如果存在错误详情
                        if (resData.detail) {
                            // 弹出错误提示
                            alert('修改失败: ' + resData.detail);
                        } else {
                            // 弹出成功提示
                            alert(resData.message || '修改成功');
                            // 刷新页面以更新数据
                            window.location.reload();
                        }
                    })
                    // 捕获并处理请求异常
                    .catch(error => alert('请求失败: ' + error));
                };

                // 将取消按钮添加到按钮容器
                btnContainer.appendChild(cancelBtn);
                // 将确认按钮添加到按钮容器
                btnContainer.appendChild(confirmBtn);
                // 将按钮容器添加到模态框内容中
                modalContent.appendChild(btnContainer);
                // 将模态框内容添加到模态框背景容器中
                modalOverlay.appendChild(modalContent);
                // 将完整的模态框添加到页面文档中
                document.body.appendChild(modalOverlay);
            })
            // 捕获获取标签请求的异常
            .catch(error => {
                // 弹出错误提示
                alert('获取标签失败: ' + error);
            });
    }

    // 定义批量修改核心词的函数
    function batchUpdateKeyword() {
        // 调用通用更新函数，字段名为 keyword，接口为 /company/batch_update_keyword
        batchUpdateField('keyword', '请输入新的核心词：', '/company/batch_update_keyword');
    }

    // 定义上传名片图片的函数，接收触发事件的 input 元素
    function uploadNamecards(input) {
        // 如果没有选择任何文件，直接返回
        if (!input.files || input.files.length === 0) return;
        
        // 创建一个 FormData 对象用于构造多部分表单数据
        const formData = new FormData();
        // 遍历所有选中的文件
        for (let i = 0; i < input.files.length; i++) {
            // 将文件追加到 FormData 对象中，键名为 files
            formData.append("files", input.files[i]);
        }
        
        // 获取触发该 input 的按钮元素（即它的下一个兄弟元素）
        const btn = input.nextElementSibling;
        // 保存按钮原来的 HTML 内容
        const originalText = btn.innerHTML;
        // 更改按钮内容为加载中状态，显示旋转图标
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 正在识别导入中，请稍候...';
        // 禁用按钮以防止重复点击
        btn.disabled = true;
        
        // 发送 POST 请求到后端的 /company/add_namecards 接口上传文件
        fetch('/company/add_namecards', {
            // 指定请求方法为 POST
            method: 'POST',
            // 将 FormData 作为请求体发送
            body: formData
        })
        // 将响应转换为 JSON
        .then(response => response.json())
        // 处理成功的数据
        .then(data => {
            // 弹出导入完成的消息
            alert(data.message || '导入完成');
            // 刷新页面以显示新导入的数据
            window.location.reload();
        })
        // 捕获请求异常
        .catch(error => {
            // 弹出请求失败的错误信息
            alert('导入请求失败: ' + error);
            // 恢复按钮的原始内容
            btn.innerHTML = originalText;
            // 重新启用按钮
            btn.disabled = false;
        });
        
        // 清空 input 的值，以便下次选择相同文件也能触发 change 事件
        input.value = '';
    }

    // 定义上传JSON文件的函数，接收触发事件的 input 元素
    function uploadJson(input) {
        // 如果没有选择任何文件，直接返回
        if (!input.files || input.files.length === 0) return;
        
        // 创建一个 FormData 对象用于构造多部分表单数据
        const formData = new FormData();
        // 遍历所有选中的文件
        for (let i = 0; i < input.files.length; i++) {
            // 将文件追加到 FormData 对象中，键名为 files
            formData.append("files", input.files[i]);
        }
        
        // 获取触发该 input 的按钮元素（即它的下一个兄弟元素）
        const btn = input.nextElementSibling;
        // 保存按钮原来的 HTML 内容
        const originalText = btn.innerHTML;
        // 更改按钮内容为加载中状态，显示旋转图标
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 正在导入JSON，请稍候...';
        // 禁用按钮以防止重复点击
        btn.disabled = true;
        
        // 发送 POST 请求到后端的 /company/import_json 接口上传文件
        fetch('/company/import_json', {
            // 指定请求方法为 POST
            method: 'POST',
            // 将 FormData 作为请求体发送
            body: formData
        })
        // 将响应转换为 JSON
        .then(response => response.json())
        // 处理成功的数据
        .then(data => {
            // 如果后端返回 message，则弹窗显示
            if (data.message) {
                alert(data.message);
            } else if (data.detail) {
                // 如果有错误信息，则弹窗显示错误
                alert("导入失败：" + data.detail);
            } else {
                // 默认成功提示
                alert('导入完成');
            }
            // 刷新页面以显示新导入的数据
            window.location.reload();
        })
        // 捕获请求异常
        .catch(error => {
            // 弹出请求失败的错误信息
            alert('导入请求失败: ' + error);
            // 恢复按钮的原始内容
            btn.innerHTML = originalText;
            // 重新启用按钮
            btn.disabled = false;
        });
        
        // 清空 input 的值，以便下次选择相同文件也能触发 change 事件
        input.value = '';
    }

    // 定义挖掘公司的函数，接收触发点击的按钮元素
    function mineCompanies(btn) {
        // 保存按钮原来的 HTML 内容
        const originalText = btn.innerHTML;
        // 更改按钮内容为挖掘中状态，显示旋转图标
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 正在挖掘中，请稍候...';
        // 禁用按钮以防止重复点击
        btn.disabled = true;
        
        // 发送 POST 请求到后端的 /company/mine 接口
        fetch('/company/mine', {
            // 指定请求方法为 POST
            method: 'POST'
        })
        // 将响应解析为 JSON
        .then(response => response.json())
        // 处理服务器返回的数据
        .then(data => {
            // 如果返回数据中有错误详情
            if (data.detail) {
                // 弹出挖掘失败的提示
                alert('挖掘失败: ' + data.detail);
            } else {
                // 弹出挖掘完成的消息
                alert(data.message || '挖掘完成');
                // 刷新页面以显示最新数据
                window.location.reload();
            }
        })
        // 捕获请求异常
        .catch(error => {
            // 弹出请求失败的提示
            alert('请求失败: ' + error);
        })
        // 无论成功还是失败都会执行的清理代码
        .finally(() => {
            // 恢复按钮的原始内容
            btn.innerHTML = originalText;
            // 重新启用按钮
            btn.disabled = false;
        });
    }
    </script>
    
    <!-- 调用父模板的 content 块，保留原有的列表渲染逻辑 -->
    {{ super() }}
{% endblock %}
