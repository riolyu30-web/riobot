<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>图片展示</title>
    <style>
        body { display: flex; flex-direction: column; align-items: center; background-color: #f0f0f0; padding: 20px; font-family: Arial, sans-serif; margin: 0; }
        .image-gallery { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; width: 100%; max-width: 100%; padding: 0 20px; box-sizing: border-box; }
        .image-container {
            display: flex;
            flex-direction: row;
            align-items: stretch;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            padding: 15px;
            width: 600px; /* 加宽以适应左右布局 */
            max-width: 100%;
            box-sizing: border-box;
        }
        .image-container > a {
            flex-shrink: 0;
            display: flex;
            align-items: center;
        }
        .image-container img {
            max-width: 250px;
            max-height: 250px;
            height: auto;
            border-radius: 4px;
            object-fit: contain;
        }
        .text-container {
            display: flex;
            flex-direction: column;
            margin-left: 15px;
            flex: 1;
            overflow: hidden; /* 防止内容撑破容器 */
        }
        .text-container .image-path {
            font-size: 9px;
            color: #888;
            margin: 0 0 5px 0;
            word-break: break-all;
            cursor: pointer;
        }
        .text-container .description {
            font-size: 12px;
            color: #333;
            margin: 0;
            padding: 0;
            flex: 1; /* 占据剩余高度 */
            overflow: hidden; /* 裁切长于图片的部分 */
            white-space: pre-wrap; /* 保留空白符和换行符 */
            cursor: pointer;
        }
        .loading { font-size: 24px; color: #555; }
    </style>
    <script>
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(function() {
                alert('已复制到剪贴板:\n' + text);
            }, function(err) {
                console.error('无法复制文本: ', err);
            });
        }
    </script>
</head>
<body>
    
    <div class="image-gallery">
        <div class="image-container">
            <a href="file:///C:/develop/nanobot/static/temp/gpt-edit-1778136317250_0.png" target="_blank">

            </a>
            <div class="text-container">
                <p class="image-path" title="C:/develop/nanobot/static/temp/gpt-edit-1778136317250_0.png" onclick="copyToClipboard(this.innerText)">C:/develop/nanobot/static/temp/gpt-edit-1778136317250_0.png</p>
                <p class="description" title="在山CHILL的木质露台上，偷得半日闲。一本书，一杯咖啡，便是最好的时光。📖☕️ #山CHILL #阅读时光 #慢生活" onclick="copyToClipboard(this.innerText)">在山CHILL的木质露台上，偷得半日闲。一本书，一杯咖啡，便是最好的时光。📖☕️ #山CHILL #阅读时光 #慢生活</p>
            </div>
        </div>
        <!-- 图片将追加到这里 -->
    </div>
</body>
</html>
